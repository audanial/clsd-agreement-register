document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin:-8px 20px 0;border:1px solid #33557F;border-radius:3px;padding:7px 10px;display:flex;gap:8px;align-items:center;background:#1A3253\">\n      <span style=\"font-size:12px;color:#E0A93B\">🔒<\u002Fspan>\n      <span style=\"font-size:10.5px;letter-spacing:0.7px;text-transform:uppercase;color:#C6D3E1;line-height:1.35\">Private &amp; Confidential<br><span style=\"letter-spacing:0.2px;text-transform:none;color:#8FA5BD\">Internal legal portal<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n\n    <nav style=\"display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;flex-direction:column;gap:2px\">\n        <div style=\"font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:#8FA5BD;padding:0 20px 8px\">Legal staff view<\u002Fdiv>\n        <sc-for list=\"{{ legalNav }}\" as=\"item\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ item.go }}\" style=\"all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13.5px;color:{{ item.fg }};background:{{ item.bg }};border-left:3px solid {{ item.mark }}\" style-hover=\"background:#2B4E7A\">\n            <span style=\"font-size:14px;width:16px;text-align:center;opacity:0.9\">{{ item.icon }}<\u002Fspan>\n            <span style=\"flex:1\">{{ item.label }}<\u002Fspan>\n            <sc-if value=\"{{ item.count }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"font-size:11px;font-weight:600;background:#7B2231;color:#fff;border-radius:9px;padding:1px 7px\">{{ item.count }}<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:2px\">\n        <div style=\"font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:#8FA5BD;padding:0 20px 8px\">Requester view<\u002Fdiv>\n        <sc-for list=\"{{ staffNav }}\" as=\"item\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ item.go }}\" style=\"all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13.5px;color:{{ item.fg }};background:{{ item.bg }};border-left:3px solid {{ item.mark }}\" style-hover=\"background:#2B4E7A\">\n            <span style=\"font-size:14px;width:16px;text-align:center;opacity:0.9\">{{ item.icon }}<\u002Fspan>\n            <span style=\"flex:1\">{{ item.label }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <div style=\"font-size:11px;color:#8FA5BD;line-height:1.5;padding:8px 20px 0\">Requesters see only their own submissions. The register is not available to them.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fnav>\n\n    <div style=\"margin-top:auto;padding:0 20px\">\n      <div style=\"border-top:1px solid #33557F;padding-top:14px;font-size:12px;line-height:1.5;color:#A9BACD\">\n        Signed in as<br>\n        <span style=\"color:#fff;font-weight:500\">{{ user.name }}<\u002Fspan><br>\n        {{ user.role }}\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- Main -->\n  <main style=\"min-width:0;display:flex;flex-direction:column\">\n    <header style=\"background:#fff;border-bottom:1px solid #DDE3EA;padding:14px 32px;display:flex;align-items:center;gap:16px;flex-wrap:wrap\">\n      <div style=\"flex:1;min-width:220px\">\n        <div style=\"font-size:11.5px;color:#6B7885;letter-spacing:0.2px\">{{ crumb }}<\u002Fdiv>\n        <h1 style=\"margin:3px 0 0;font-family:'IBM Plex Serif',serif;font-size:20px;font-weight:600;letter-spacing:-0.1px\">{{ pageTitle }}<\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <span style=\"font-size:11px;letter-spacing:0.6px;text-transform:uppercase;color:#7B2231;border:1px solid #E0BCC2;background:#FBF2F3;border-radius:3px;padding:5px 9px;white-space:nowrap\">Private &amp; Confidential<\u002Fspan>\n        <button style=\"all:unset;cursor:pointer;font-size:12.5px;color:#1F3A5F;border:1px solid #C9D3DD;border-radius:4px;padding:7px 12px;background:#fff\" style-hover=\"background:#F0F4F8\">Notifications (4)<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div style=\"padding:26px 32px 56px;display:flex;flex-direction:column;gap:22px;max-width:1360px\">\n\n      <!-- ============ 1. SHARED LEGAL INBOX ============ -->\n      <sc-if value=\"{{ isDash }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n\n          <div style=\"background:#EEF3F8;border:1px solid #D3DFEA;border-left:3px solid #1F3A5F;border-radius:4px;padding:12px 16px;font-size:12.5px;color:#3B4855;line-height:1.6\">\n            Shared CLSD queue. <strong style=\"font-weight:600\">Any Legal staff member can open, review and act on any submission<\u002Fstrong> — there is no case ownership or manager assignment. Review activity below shows who has already started, so two officers do not duplicate work. Requests and documents arrive here directly instead of by email.\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px\">\n            <sc-for list=\"{{ statCards }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ c.pick }}\" style=\"all:unset;cursor:pointer;background:#fff;border:1px solid {{ c.border }};border-top:3px solid {{ c.accent }};border-radius:4px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px\" style-hover=\"border-color:#1F3A5F\">\n                <div style=\"font-size:11.5px;letter-spacing:0.4px;text-transform:uppercase;color:#6B7885;font-weight:500\">{{ c.label }}<\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Serif',serif;font-size:30px;line-height:1;font-weight:600;color:#16202B\">{{ c.value }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#7A8794\">{{ c.hint }}<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <section style=\"background:#fff;border:1px solid #DDE3EA;border-radius:4px\">\n            <div style=\"padding:14px 18px;border-bottom:1px solid #E7ECF1;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap\">\n              <label style=\"display:flex;flex-direction:column;gap:5px;flex:1;min-width:230px\">\n                <span style=\"font-size:11.5px;color:#4A5663;font-weight:500\">Search title, partner or requester<\u002Fspan>\n                <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"e.g. Industry 4.0 or Sinar Teknologi\" style=\"border:1px solid #C9D3DD;border-radius:4px;padding:8px 10px;font-size:13px;color:#16202B;background:#fff\">\n              <\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:5px;min-width:190px\">\n                <span style=\"font-size:11.5px;color:#4A5663;font-weight:500\">Campus / institute<\u002Fspan>\n                <sc-raw-select value=\"{{ dept }}\" sc-camel-on-change=\"{{ onDept }}\" style=\"border:1px solid #C9D3DD;border-radius:4px;padding:8px 10px;font-size:13px;background:#fff;color:#16202B\">\n                  <sc-for list=\"{{ deptOptions }}\" as=\"d\" hint-placeholder-count=\"4\"><option value=\"{{ d }}\">{{ d }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:5px;min-width:170px\">\n                <span style=\"font-size:11.5px;color:#4A5663;font-weight:500\">Agreement type<\u002Fspan>\n                <sc-raw-select value=\"{{ atype }}\" sc-camel-on-change=\"{{ onType }}\" style=\"border:1px solid #C9D3DD;border-radius:4px;padding:8px 10px;font-size:13px;background:#fff;color:#16202B\">\n                  <sc-for list=\"{{ typeOptions }}\" as=\"t\" hint-placeholder-count=\"4\"><option value=\"{{ t }}\">{{ t }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Flabel>\n              <button sc-camel-on-click=\"{{ resetFilters }}\" style=\"all:unset;cursor:pointer;font-size:12.5px;color:#1F3A5F;border:1px solid #C9D3DD;border-radius:4px;padding:8px 12px;background:#fff\" style-hover=\"background:#F0F4F8\">Reset<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"padding:10px 18px;border-bottom:1px solid #E7ECF1;display:flex;gap:6px;flex-wrap:wrap;align-items:center\">\n              <span style=\"font-size:11.5px;color:#6B7885;margin-right:4px\">Status:<\u002Fspan>\n              <sc-for list=\"{{ statusFilters }}\" as=\"s\" hint-placeholder-count=\"5\">\n                <button sc-camel-on-click=\"{{ s.pick }}\" style=\"all:unset;cursor:pointer;font-size:12px;padding:5px 11px;border-radius:14px;border:1px solid {{ s.border }};background:{{ s.bg }};color:{{ s.fg }};white-space:nowrap\" style-hover=\"border-color:#1F3A5F\">{{ s.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"overflow-x:auto\">\n              <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13px;min-width:1120px\">\n                <sc-raw-caption style=\"text-align:left;padding:12px 18px 6px;font-size:12px;color:#6B7885\">Shared submissions queue — {{ rowCount }} submissions shown · visible to all CLSD legal staff<\u002Fsc-raw-caption>\n                <sc-raw-thead>\n                  <sc-raw-tr style=\"background:#F7F9FB;text-align:left\">\n                    <sc-raw-th scope=\"col\" style=\"padding:11px 14px;border-bottom:1px solid #DDE3EA;font-size:11.5px;letter-spacing:0.4px;text-transform:uppercase;color:#4A5663;font-weight:600;width:48px\">No.<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"padding:11px 14px;border-bottom:1px solid #DDE3EA;font-size:11.5px;letter-spacing:0.4px;text-transform:uppercase;color:#4A5663;font-weight:600\">Agreement title<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"padding:11px 14px;border-bottom:1px solid #DDE3EA;font-size:11.5px;letter-spacing:0.4px;text-transform:uppercase;color:#4A5663;font-weight:600\">Department<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"padding:11px 14px;border-bottom:1px solid #DDE3EA;font-size:11.5px;letter-spacing:0.4px;text-transform:uppercase;color:#4A5663;font-weight:600\">Requester<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"padding:11px 14px;border-bottom:1px solid #DDE3EA;font-size:11.5px;letter-spacing:0.4px;text-transform:uppercase;color:#4A5663;font-weight:600\">Type<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"padding:11px 14px;border-bottom:1px solid #DDE3EA;font-size:11.5px;letter-spacing:0.4px;text-transform:uppercase;color:#4A5663;font-weight:600;white-space:nowrap\">Date submitted<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"padding:11px 14px;border-bottom:1px solid #DDE3EA;font-size:11.5px;letter-spacing:0.4px;text-transform:uppercase;color:#4A5663;font-weight:600\">Review activity<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"padding:11px 14px;border-bottom:1px solid #DDE3EA;font-size:11.5px;letter-spacing:0.4px;text-transform:uppercase;color:#4A5663;font-weight:600\">Status<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"padding:11px 14px;border-bottom:1px solid #DDE3EA;font-size:11.5px;letter-spacing:0.4px;text-transform:uppercase;color:#4A5663;font-weight:600\">Actions<\u002Fsc-raw-th>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                    <sc-raw-tr style=\"border-bottom:1px solid #EDF1F5;vertical-align:top\" style-hover=\"background:#F9FBFC\">\n                      <sc-raw-td style=\"padding:{{ cellPad }};color:#7A8794;font-variant-numeric:tabular-nums\">{{ r.no }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:{{ cellPad }};max-width:280px;color:#16202B\"><button sc-camel-on-click=\"{{ r.open }}\" style=\"all:unset;cursor:pointer;color:#1F3A5F;text-decoration:underline;text-underline-offset:2px;font-weight:500\">{{ r.title }}<\u002Fbutton><sc-if value=\"{{ r.urgent }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"margin-left:7px;font-size:10.5px;font-weight:600;color:#7B2231;border:1px solid #E0BCC2;background:#FBF2F3;border-radius:3px;padding:1px 5px;white-space:nowrap\">URGENT<\u002Fspan><\u002Fsc-if><\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:{{ cellPad }};color:#4A5663\">{{ r.dept }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:{{ cellPad }};color:#4A5663;white-space:nowrap\">{{ r.requester }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:{{ cellPad }};color:#4A5663\">{{ r.type }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:{{ cellPad }};color:#4A5663;white-space:nowrap;font-variant-numeric:tabular-nums\">{{ r.date }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:{{ cellPad }};color:{{ r.activityFg }};max-width:230px;line-height:1.45\">{{ r.activity }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:{{ cellPad }}\"><span style=\"display:inline-block;font-size:11.5px;font-weight:500;white-space:nowrap;border-radius:3px;padding:3px 8px;border:1px solid {{ r.badgeBorder }};background:{{ r.badgeBg }};color:{{ r.badgeFg }}\">{{ r.status }}<\u002Fspan><\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:{{ cellPad }};white-space:nowrap\">\n                        <div style=\"display:flex;gap:6px\">\n                          <button sc-camel-on-click=\"{{ r.open }}\" style=\"all:unset;cursor:pointer;font-size:12px;color:#fff;background:#1F3A5F;border-radius:3px;padding:5px 10px\" style-hover=\"background:#2B4E7A\">Open<\u002Fbutton>\n                          <button sc-camel-on-click=\"{{ r.open }}\" style=\"all:unset;cursor:pointer;font-size:12px;color:#1F3A5F;border:1px solid #C9D3DD;border-radius:3px;padding:5px 10px\" style-hover=\"background:#F0F4F8\">{{ r.secondary }}<\u002Fbutton>\n                        <\u002Fdiv>\n                      <\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-if value=\"{{ noRows }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:26px 18px;font-size:13px;color:#6B7885\">No submissions match the current filters.<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"padding:12px 18px;border-top:1px solid #E7ECF1;background:#FBFCFD;font-size:11.5px;color:#7A8794;line-height:1.55\">Access is limited to CLSD legal staff. All opens, downloads and status changes are recorded in each submission's audit history.<\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ 2. NEW SUBMISSION FORM ============ -->\n      <sc-if value=\"{{ isForm }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px;align-items:start\">\n          <div style=\"display:flex;flex-direction:column;gap:18px\">\n\n            <section style=\"background:#fff;border:1px solid #DDE3EA;border-radius:4px\">\n              <h2 style=\"margin:0;padding:13px 18px;border-bottom:1px solid #E7ECF1;font-family:'IBM Plex Serif',serif;font-size:15px;font-weight:600\">1. Agreement details<\u002Fh2>\n              <div style=\"padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px\">\n                <label style=\"display:flex;flex-direction:column;gap:6px;grid-column:1/-1\">\n                  <span style=\"font-size:12px;font-weight:500;color:#3B4855\">Agreement title <span style=\"color:#7B2231\">*<\u002Fspan><\u002Fspan>\n                  <input placeholder=\"e.g. Industry 4.0 Talent Development Programme\" style=\"border:1px solid #C9D3DD;border-radius:4px;padding:9px 11px;font-size:13px\">\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:6px\">\n                  <span style=\"font-size:12px;font-weight:500;color:#3B4855\">Agreement type <span style=\"color:#7B2231\">*<\u002Fspan><\u002Fspan>\n                  <sc-raw-select value=\"{{ formType }}\" sc-camel-on-change=\"{{ onFormType }}\" style=\"border:1px solid #C9D3DD;border-radius:4px;padding:9px 11px;font-size:13px;background:#fff\">\n                    <sc-for list=\"{{ formTypeOptions }}\" as=\"t\" hint-placeholder-count=\"6\"><option value=\"{{ t }}\">{{ t }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:6px\">\n                  <span style=\"font-size:12px;font-weight:500;color:#3B4855\">Partner organisation <span style=\"color:#7B2231\">*<\u002Fspan><\u002Fspan>\n                  <input placeholder=\"Full registered name of partner\" style=\"border:1px solid #C9D3DD;border-radius:4px;padding:9px 11px;font-size:13px\">\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:6px;grid-column:1/-1\">\n                  <span style=\"font-size:12px;font-weight:500;color:#3B4855\">Purpose / scope of the agreement <span style=\"color:#7B2231\">*<\u002Fspan><\u002Fspan>\n                  <textarea rows=\"4\" placeholder=\"Describe the intended activities, obligations of each party, duration and any financial arrangement.\" style=\"border:1px solid #C9D3DD;border-radius:4px;padding:9px 11px;font-size:13px;resize:vertical;line-height:1.55\"><\u002Ftextarea>\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fsection>\n\n            <section style=\"background:#fff;border:1px solid #DDE3EA;border-radius:4px\">\n              <h2 style=\"margin:0;padding:13px 18px;border-bottom:1px solid #E7ECF1;font-family:'IBM Plex Serif',serif;font-size:15px;font-weight:600\">2. Requester &amp; department<\u002Fh2>\n              <div style=\"padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n                <label style=\"display:flex;flex-direction:column;gap:6px\">\n                  <span style=\"font-size:12px;font-weight:500;color:#3B4855\">Requester name (PIC)<\u002Fspan>\n                  <input value=\"S. Ariffin\" style=\"border:1px solid #C9D3DD;border-radius:4px;padding:9px 11px;font-size:13px;background:#F7F9FB;color:#4A5663\" readonly=\"readonly\">\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:6px\">\n                  <span style=\"font-size:12px;font-weight:500;color:#3B4855\">Staff email<\u002Fspan>\n                  <input value=\"s.ariffin@staff.unikl.edu.my\" style=\"border:1px solid #C9D3DD;border-radius:4px;padding:9px 11px;font-size:13px;background:#F7F9FB;color:#4A5663\" readonly=\"readonly\">\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:6px\">\n                  <span style=\"font-size:12px;font-weight:500;color:#3B4855\">Department / office <span style=\"color:#7B2231\">*<\u002Fspan><\u002Fspan>\n                  <sc-raw-select style=\"border:1px solid #C9D3DD;border-radius:4px;padding:9px 11px;font-size:13px;background:#fff\">\n                    <option>Academic Affairs Office<\u002Foption>\n                    <option>Industry Linkages &amp; Placement<\u002Foption>\n                    <option>Research &amp; Innovation Office<\u002Foption>\n                    <option>Facilities &amp; Procurement<\u002Foption>\n                    <option>Student Affairs<\u002Foption>\n                  <\u002Fsc-raw-select>\n 11px;color:#8794A1;margin-top:2px\">{{ d.size }}<\u002Fdiv><\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:11px 14px;color:#4A5663\">{{ d.type }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:11px 14px;color:#4A5663;font-variant-numeric:tabular-nums\">{{ d.ver }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:11px 14px;color:#4A5663;white-space:nowrap\">{{ d.date }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:11px 14px;color:#4A5663\">{{ d.by }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:11px 14px;white-space:nowrap\">\n                          <sc-if value=\"{{ d.pending }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span style=\"font-size:11.5px;color:#7B2231;border:1px solid #E0BCC2;background:#FBF2F3;border-radius:3px;padding:3px 7px;white-space:nowrap\">Awaiting upload<\u002Fspan>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ d.available }}\" hint-placeholder-val=\"{{ true }}\">\n                            <span style=\"display:flex;gap:10px\"><a href=\"#view\" style=\"font-size:12px\">View<\u002Fa><a href=\"#download\" style=\"font-size:12px\">Download<\u002Fa><\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tbody>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n              <div style=\"padding:12px 18px;border-top:1px solid #E7ECF1;background:#FBFCFD;font-size:12px;color:#6B7885;line-height:1.55\">All CLSD legal staff can view and download every file. Superseded versions are retained; downloads are logged in the audit history.<\u002Fdiv>\n            <\u002Fsection>\n\n            <section style=\"background:#fff;border:1px solid #DDE3EA;border-radius:4px;display:flex;flex-direction:column;min-width:0\">\n              <div style=\"display:flex;border-bottom:1px solid #E7ECF1\">\n                <sc-for list=\"{{ detailTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n                  <button sc-camel-on-click=\"{{ t.pick }}\" style=\"all:unset;cursor:pointer;padding:12px 15px;font-size:12.5px;font-weight:500;color:{{ t.fg }};border-bottom:2px solid {{ t.mark }};background:{{ t.bg }}\" style-hover=\"background:#F4F7FA\">{{ t.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ tabComments }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"padding:16px 18px;display:flex;flex-direction:column;gap:14px\">\n                  <sc-for list=\"{{ comments }}\" as=\"c\" hint-placeholder-count=\"3\">\n                    <div style=\"border-left:2px solid {{ c.mark }};padding-left:12px\">\n                      <div style=\"display:flex;gap:8px;align-items:baseline;flex-wrap:wrap\">\n                        <span style=\"font-size:12.5px;font-weight:600\">{{ c.who }}<\u002Fspan>\n                        <span style=\"font-size:11px;color:#8794A1\">{{ c.role }} · {{ c.when }}<\u002Fspan>\n                        <span style=\"font-size:10.5px;font-weight:500;white-space:nowrap;border-radius:3px;padding:1px 6px;border:1px solid {{ c.tagBorder }};background:{{ c.tagBg }};color:{{ c.tagFg }}\">{{ c.tag }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <p style=\"margin:5px 0 0;font-size:12.5px;color:#3B4855;line-height:1.6\">{{ c.text }}<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n\n                  <div style=\"border-top:1px solid #E7ECF1;padding-top:14px;display:flex;flex-direction:column;gap:10px\">\n                    <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                      <sc-for list=\"{{ channelOptions }}\" as=\"v\" hint-placeholder-count=\"2\">\n                        <button sc-camel-on-click=\"{{ v.pick }}\" style=\"all:unset;cursor:pointer;font-size:12px;font-weight:500;padding:7px 12px;border-radius:4px;white-space:nowrap;border:1px solid {{ v.border }};background:{{ v.bg }};color:{{ v.fg }}\">{{ v.label }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:{{ channelNoteFg }};background:{{ channelNoteBg }};border:1px solid {{ channelNoteBorder }};border-radius:4px;padding:8px 11px;line-height:1.5\">{{ channelNote }}<\u002Fdiv>\n                    <textarea rows=\"3\" value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraft }}\" placeholder=\"{{ draftPlaceholder }}\" style=\"border:1px solid #C9D3DD;border-radius:4px;padding:9px 11px;font-size:12.5px;resize:vertical;line-height:1.55\"><\u002Ftextarea>\n                    <button sc-camel-on-click=\"{{ postComment }}\" style=\"all:unset;cursor:pointer;align-self:flex-start;font-size:12.5px;font-weight:500;color:#fff;background:#1F3A5F;border-radius:4px;padding:8px 16px\" style-hover=\"background:#2B4E7A\">{{ postLabel }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ tabAudit }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:16px 18px;display:flex;flex-direction:column;gap:0\">\n                  <sc-for list=\"{{ audit }}\" as=\"a\" hint-placeholder-count=\"6\">\n                    <div style=\"display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;align-items:start;padding-bottom:14px\">\n                      <div style=\"display:flex;flex-direction:column;align-items:center;height:100%\">\n                        <span style=\"width:9px;height:9px;border-radius:50%;background:{{ a.dot }};margin-top:4px;flex:none\"><\u002Fspan>\n                        <span style=\"width:1px;flex:1;background:#E1E7ED;margin-top:3px\"><\u002Fspan>\n                      <\u002Fdiv>\n                      <div>\n                        <div style=\"font-size:11px;color:#8794A1;line-height:1.4;font-variant-numeric:tabular-nums;margin-bottom:2px\">{{ a.when }}<\u002Fdiv>\n                        <div style=\"font-size:12.5px;color:#16202B;line-height:1.5\">{{ a.what }}<\u002Fdiv>\n                        <div style=\"font-size:11.5px;color:#7A8794;margin-top:2px\">{{ a.who }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"font-size:11.5px;color:#7A8794;border-top:1px solid #E7ECF1;padding-top:12px;line-height:1.55\">Entries marked internal are never shown to the requester.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsection>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ 4. MY SUBMISSIONS (REQUESTER) ============ -->\n      <sc-if value=\"{{ isMine }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <div style=\"background:#FDF2EA;border:1px solid #EBCBAE;border-left:3px solid #B0641F;border-radius:4px;padding:12px 16px;font-size:12.5px;color:#4A4335;line-height:1.55\">\n            One submission has the status <strong style=\"font-weight:600\">Revision Required<\u002Fstrong>. Open it to read Legal's message and upload the revised files.\n          <\u002Fdiv>\n\n          <section style=\"background:#fff;border:1px solid #DDE3EA;border-radius:4px\">\n            <div style=\"padding:13px 18px;border-bottom:1px solid #E7ECF1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center\">\n              <div>\n                <h2 style=\"margin:0;font-family:'IBM Plex Serif',serif;font-size:15px;font-weight:600\">My submissions<\u002Fh2>\n                <div style=\"font-size:11.5px;color:#7A8794;margin-top:3px\">You are viewing your own submissions only. Requests from other staff are not accessible.<\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ goForm }}\" style=\"all:unset;cursor:pointer;font-size:12.5px;font-weight:500;color:#fff;background:#1F3A5F;border-radius:4px;padding:8px 14px;white-space:nowrap\" style-hover=\"background:#2B4E7A\">New submission<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"overflow-x:auto\">\n              <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13px;min-width:820px\">\n                <sc-raw-thead>\n                  <sc-raw-tr style=\"background:#F7F9FB;text-align:left\">\n                    <sc-raw-th scope=\"col\" style=\"padding:11px 16px;border-bottom:1px solid #DDE3EA;font-size:11px;letter-spacing:0.4px;text-transform:uppercase;color:#4A5663;font-weight:600;width:48px\">No.<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"padding:11px 16px;border-bottom:1px solid #DDE3EA;font-size:11px;letter-spacing:0.4px;text-transform:uppercase;color:#4A5663;font-weight:600\">Agreement title<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"padding:11px 16px;border-bottom:1px solid #DDE3EA;font-size:11px;letter-spacing:0.4px;text-transform:uppercase;color:#4A5663;font-weight:600\">Type<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"padding:11px 16px;border-bottom:1px solid #DDE3EA;font-size:11px;letter-spacing:0.4px;text-transform:uppercase;color:#4A5663;font-weight:600\">Submitted<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"padding:11px 16px;border-bottom:1px solid #DDE3EA;font-size:11px;letter-spacing:0.4px;text-transform:uppercase;color:#4A5663;font-weight:600\">Status<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"padding:11px 16px;border-bottom:1px solid #DDE3EA;font-size:11px;letter-spacing:0.4px;text-transform:uppercase;color:#4A5663;font-weight:600\">Action needed<\u002Fsc-raw-th>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ mineRows }}\" as=\"m\" hint-placeholder-count=\"5\">\n                    <sc-raw-tr style=\"border-bottom:1px solid #EDF1F5;background:{{ m.rowBg }}\">\n                      <sc-raw-td style=\"padding:12px 16px;color:#7A8794;font-variant-numeric:tabular-nums\">{{ m.no }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:12px 16px;max-width:300px\"><button sc-camel-on-click=\"{{ m.open }}\" style=\"all:unset;cursor:pointer;color:#1F3A5F;text-decoration:underline;text-underline-offset:2px;font-weight:500\">{{ m.title }}<\u002Fbutton><\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:12px 16px;color:#4A5663\">{{ m.type }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:12px 16px;color:#4A5663;white-space:nowrap;font-variant-numeric:tabular-nums\">{{ m.date }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:12px 16px\"><span style=\"display:inline-block;font-size:11.5px;font-weight:500;white-space:nowrap;border-radius:3px;padding:3px 8px;border:1px solid {{ m.badgeBorder }};background:{{ m.badgeBg }};color:{{ m.badgeFg }}\">{{ m.status }}<\u002Fspan><\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:12px 16px;font-size:12.5px;color:{{ m.needFg }}\">{{ m.need }}<\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section style=\"background:#fff;border:1px solid #DDE3EA;border-radius:4px\">\n            <div style=\"padding:14px 18px;border-bottom:1px solid #E7ECF1;display:flex;gap:12px;align-items:center;flex-wrap:wrap\">\n              <div style=\"flex:1;min-width:240px\">\n                <div style=\"font-size:12px;color:#6B7885\">Opened submission<\u002Fdiv>\n                <h3 style=\"margin:3px 0 0;font-family:'IBM Plex Serif',serif;font-size:16px;font-weight:600\">{{ openMine.title }}<\u002Fh3>\n              <\u002Fdiv>\n              <span style=\"display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:500;border-radius:3px;padding:4px 9px;border:1px solid {{ openMine.badgeBorder }};background:{{ openMine.badgeBg }};color:{{ openMine.badgeFg }}\">{{ openMine.status }}<\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"padding:12px 18px;background:#F6F9FC;border-bottom:1px solid #E7ECF1;display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n              <span style=\"font-size:10.5px;letter-spacing:0.6px;text-transform:uppercase;color:#7B2231;border:1px solid #E0BCC2;background:#FBF2F3;border-radius:3px;padding:3px 8px;white-space:nowrap\">Private &amp; Confidential<\u002Fspan>\n              <span style=\"font-size:12px;color:#3B4855\">Only you and authorised Legal staff can access this submission.<\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;align-items:start\">\n              <div>\n                <h4 style=\"margin:0 0 10px;font-size:12px;letter-spacing:0.5px;text-transform:uppercase;color:#4A5663\">Messages from Legal<\u002Fh4>\n                <div style=\"display:flex;flex-direction:column;gap:12px\">\n                  <sc-for list=\"{{ staffComments }}\" as=\"c\" hint-placeholder-count=\"2\">\n                    <div style=\"border:1px solid #E4E9EF;border-radius:4px;padding:12px 14px;background:#FBFCFD\">\n                      <div style=\"font-size:12px;color:#6B7885\">{{ c.who }} · {{ c.when }}<\u002Fdiv>\n                      <p style=\"margin:6px 0 0;font-size:12.5px;color:#3B4855;line-height:1.6\">{{ c.text }}<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <p style=\"margin:12px 0 0;font-size:11.5px;color:#8794A1;line-height:1.55\">Only messages addressed to you are shown here. Internal Legal notes are not visible to requesters.<\u002Fp>\n              <\u002Fdiv>\n\n              <div>\n                <div style=\"display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px\">\n                  <h4 style=\"margin:0;font-size:12px;letter-spacing:0.5px;text-transform:uppercase;color:#4A5663\">Revised documents requested<\u002Fh4>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:9px\">\n                  <sc-for list=\"{{ requested }}\" as=\"r\" hint-placeholder-count=\"2\">\n                    <div style=\"border:1px solid {{ r.border }};background:{{ r.bg }};border-radius:4px;padding:11px 13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap\">\n                      <div style=\"flex:1;min-width:170px\">\n                        <div style=\"font-size:12.5px;font-weight:500\">{{ r.label }}<\u002Fdiv>\n                        <div style=\"font-size:11.5px;color:#6B7885;margin-top:2px\">{{ r.note }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font-size:12px;color:#2C6E49\">{{ r.file }}<\u002Fdiv>\n                      <button sc-camel-on-click=\"{{ r.attach }}\" style=\"all:unset;cursor:pointer;font-size:12px;color:#1F3A5F;border:1px solid #C9D3DD;border-radius:4px;padding:6px 12px;background:#fff;white-space:nowrap\" style-hover=\"background:#F0F4F8\">{{ r.btn }}<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap\">\n                  <button sc-camel-on-click=\"{{ resubmit }}\" style=\"all:unset;cursor:pointer;font-size:13px;font-weight:500;color:#fff;background:#1F3A5F;border-radius:4px;padding:10px 18px;white-space:nowrap\" style-hover=\"background:#2B4E7A\">Upload revised documents<\u002Fbutton>\n                  <sc-if value=\"{{ resubmitted }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"font-size:12.5px;color:#2C6E49;background:#EDF6F0;border:1px solid #BEDDCA;border-radius:4px;padding:8px 12px\">Sent to Legal. Status changed to In Review.<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ 5. AGREEMENT REGISTER DETAIL ============ -->\n      <sc-if value=\"{{ isRegister }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n\n          <div style=\"background:#F6F9FC;border:1px solid #D3DFEA;border-left:3px solid #1F3A5F;border-radius:4px;padding:11px 15px;font-size:12.5px;color:#3B4855;line-height:1.55\">\n            The Agreement Register is restricted to CLSD legal staff. Requesters cannot access the register or its records.\n          <\u002Fdiv>\n\n          <section style=\"background:#fff;border:1px solid #DDE3EA;border-top:3px solid #7B2231;border-radius:4px;padding:18px\">\n            <div style=\"display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start\">\n              <div style=\"flex:1;min-width:300px\">\n                <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n                  <span style=\"font-size:12.5px;font-weight:600;letter-spacing:0.4px;color:#7B2231;font-variant-numeric:tabular-nums;white-space:nowrap\">AGR/UniKL/2026/0087<\u002Fspan>\n                  <span style=\"display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:500;border-radius:3px;padding:3px 8px;border:1px solid #BEDDCA;background:#EDF6F0;color:#2C6E49\">Active<\u002Fspan>\n                  <span style=\"display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:500;border-radius:3px;padding:3px 8px;border:1px solid #BFD3EA;background:#EDF3F
